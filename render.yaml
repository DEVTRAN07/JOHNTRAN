# Render Blueprint — deploy bot 24/7 miễn phí
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này.
# Sau khi tạo: Settings → Environment → thêm JT_ACCOUNT_JSON, JT_COOKIE_JSON
# (nội dung file account.json / cookie.json sau khi đăng nhập local), rồi Manual Deploy.
services:
  - type: web
    name: johntran-zalo-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node JohnTran.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JT_PANEL__ENABLED
        value: "0"
      # secret điền tay trên dashboard (KHÔNG commit):
      #   JT_ACCOUNT_JSON = {"imei":"...","userAgent":"...","cookie":"cookie.json"}
      #   JT_COOKIE_JSON  = [ ...nội dung cookie.json... ]
      #   JT_AI__GEMINI_KEYS = key1,key2   (tuỳ chọn)
