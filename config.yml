account_file: "account.json" # file chứa thông tin login

# cấu hình login bằng qrcode
login_qrcode: true # tự động chuyển sang qrcode login khi cookie không thể login
qrcode_path: "qr.png" # ảnh qrcode
save_cookie: true # tư động lưu lại cookie sau khi đăng nhập bắng qrcode xong

# cấu hình bot
prefix: "/"
name_bot: "ᴶᴼᴴᴺ ᵀᴿᴬᴺ"
# sử dụng lệnh /id để lấy id
# chú ý: mỗi acc chạy bot get info sẽ ra 1 id khác nhau nên nếu đổi acc chạy bot phải đổi id (do zalỏ lưu data ở local)
admin_bot:
  - "418669971689260834"
  - ""
support_bot:
  - "418669971689260834"
  - ""
allow_private_command: false # false = bot BỎ QUA toàn bộ tin nhắn riêng (chỉ hoạt động trong nhóm)
allow_self_command: true # true = bot chạy lệnh từ tin do CHÍNH acc bot gửi (test bot bằng acc bot). Tắt nếu không muốn bot tự thực thi tin nhắn của chính nó

hot_reload: true # tự nạp lại plugin khi file thay đổi (không cần restart)

# ===== THIẾT BỊ ĐĂNG NHẬP =====
# userAgent quyết định thiết bị hiển thị trên Zalo (imei được sinh TỪ userAgent này).
# Để trống = tự đo theo OS đang chạy bot (mac/windows/linux).
# Đổi user_agent là PHẢI xoá account.json + cookie.json rồi quét QR lại!
device:
  user_agent: "" # ví dụ macOS: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:133.0) Gecko/20100101 Firefox/133.0

# ===== WEB PANEL QUẢN LÝ BOT =====
panel:
  enabled: false # bật panel quản lý bot + bot con
  host: "0.0.0.0"
  port: 3000
  token: "jt6132a94559f0bcc44662222e" # để trống = không cần đăng nhập (chỉ dùng khi mở public)

# cấu hình của zalo-client
zalo_client_config:
  selfListen: true # true = bot xử lý cả tin do CHÍNH acc bot gửi (test bot bằng acc đã chạy bot)
  logging: "info"

# ===== BẢO MẬT & RIÊNG TƯ (ᴶᴼᴴᴺ ᵀᴿᴬᴺ) =====
# Bot chỉ gửi dữ liệu (từ khóa, prompt, link) tới các host trong danh sách dưới đây.
# Mọi request ra host lạ sẽ bị CHẶN và ghi log cảnh báo.
privacy:
  allow_all_hosts: false # true = tắt bộ lọc (không khuyến nghị)
  allowed_hosts: # host/suffix được phép (vd: soundcloud.com khớp cả api-v2.soundcloud.com)
    - soundcloud.com
    - sndcdn.com
    - api-v2.soundcloud.com
    - translate.google.com
    - files.catbox.moe
    - catbox.moe
    - litterbox.catbox.moe
    - litter.catbox.moe
    - www.tikwm.com
    - tikwm.com
    - v16m.tiktokcdn-us.com
    - v19-notes.tiktokcdn-us.com
    - tiktokcdn-us.com
    - tiktokcdn.com
    - imgur.com
    - i.imgur.com
    - postimg.cc
    - i.postimg.cc
    - pinimg.com
    - i.pinimg.com
    - drive.google.com
    - dpaste.com
    - googleusercontent.com
    - stickers.zaloapp.com
    - fbcdn.net
    - zalo.ai
    - zadn.vn
    - dlfl.vn
    - zdn.vn
    - api.checkphatnguoi.vn

# ===== DỊCH VỤ NGOÀI (chỉ chạy khi admin tự cấu hình endpoint) =====
# Để trống = tính năng tắt hoàn toàn, bot KHÔNG gửi dữ liệu đi đâu cả.
services:
  # --- Tải media (autodown) ---
  media_downloader_url: "" # endpoint tải media genergic (autodown)
  # --- TikTok/Douyin ---
  tiktok_api_url: "" # endpoint lấy VIDEO tiktok/douyin (autodown). ĐỂ TRỐNG = dùng tikwm.com mặc định
  # --- Facebook (cardfb) ---
  facebook_api_url: "https://graph.facebook.com/v19.0" # endpoint Graph API cho /cardfb
  facebook_access_token: "13968a890f7b214e24d372f0941d349f45a5176666abdec28dffabe38d18405c" # token Graph API (lấy ở developers.facebook.com). ĐỂ TRỐNG = /cardfb báo cách bật
  # --- Tiện ích ---
  phatnguoi_url: "https://api.checkphatnguoi.vn/phatnguoi" # kiểm tra phạt nguội (phatnguoi)
  dpaste_url: "https://dpaste.com/api/v2/" # paste text trực tuyến (adc)

# ===== ĐỌC GIỌNG NÓI (/noi — Google TTS miễn phí) =====
ai:
  tts_enabled: true # bật lệnh /noi đọc giọng nói bằng Google TTS (miễn phí)

# ===== CANVAS (ảnh menu/thẻ/nhạc) =====
canvas:
  theme: editorial # classic | editorial (đen–nhũ vàng, kiểu riêng)
  width: 750 # cỡ ảnh render: 750 = Zalo gửi NGUYÊN BẢN (không resize/nén HD) • 1280 = lớn nhưng bị Zalo nén
  quality: 100 # chất lượng PNG lossless (giữ original, không nén)

# ===== NHẠC (/scl — SoundCloud) =====
music:
  max_results: 5 # số kết quả hiển thị mỗi lần tìm
  cache_ttl: 300000 # thời gian nhớ danh sách chọn bài (ms)
  soundcloud_client_id: "" # để trống = bot tự lấy client_id từ asset chính chủ SoundCloud

# ===== TẢI MEDIA (autodown) =====
# YouTube đang chặn bot → dùng nightly yt-dlp đã fix đa số trường hợp.
# Nếu vẫn báo "Sign in to confirm you're not a bot" thì cần cookie:
media:
  # Cách 2 (chạy trên MÁY BẠN, có trình duyệt đã đăng nhập YouTube):
  # chrome | safari | firefox | edge | brave | chromium
  # Không có trình duyệt đó (vd chạy trên Render) thì bot tự bỏ cờ và chạy lại.
  ytdlp_cookies_from_browser: "chrome"
  # Cách 1 (Render/cloud — KHÔNG có trình duyệt): export cookies.txt rồi trỏ đường dẫn
  ytdlp_cookies_file: "" # vd: /app/cookies.txt hoặc set env YTDLP_COOKIES_FILE

