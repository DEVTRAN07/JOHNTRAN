# ===== DỊCH VỤ NGOÀI (chỉ chạy khi admin tự cấu hình endpoint) =====
# Để trống = tính năng tắt hoàn toàn, bot KHÔNG gửi dữ liệu đi đâu cả.
services:
  # --- Tải media (autodown) ---
  media_downloader_url: "" # endpoint tải media genergic (autodown)
  # --- TikTok/Douyin ---
  tiktok_api_url: "" # endpoint lấy VIDEO tiktok/douyin (autodown). ĐỂ TRỐNG = dùng tikwm.com mặc định
  # --- Facebook (cardfb) ---
  facebook_api_url: "https://graph.facebook.com/v19.0" # endpoint Graph API cho /cardfb
  facebook_access_token: "" # token Graph API (lấy ở developers.facebook.com). ĐỂ TRỐNG = /cardfb báo cách bật. Set via env JT_SERVICES__FACEBOOK_ACCESS_TOKEN or paste locally (do not commit)
  # --- Tiện ích ---
  dpaste_url: "https://dpaste.com/api/v2/" # paste text trực tuyến (adc)

# ===== ĐỌC GIỌNG NÓI (/noi — Google TTS miễn phí) =====
ai:
  tts_enabled: true # bật lệnh /noi đọc giọng nói bằng Google TTS (miễn phí)

# ===== CANVAS (ảnh menu/thẻ/nhạc) =====
canvas:
  theme: editorial # classic | editorial (đen–nhũ vàng, kiểu riêng)
  width: 750 # cỡ ảnh render: 750 = Zalo gửi NGUYÊN BẢN (không resize/nén HD) • 1280 = lớn nhưng bị Zalo nén
  quality: 100 # chất lượng PNG lossless (giữ original, không nén)

# ===== NHẠC (/scl — SoundCloud) =====
music:
  max_results: 5 # số kết quả hiển thị mỗi lần tìm
  cache_ttl: 300000 # thời gian nhớ danh sách chọn bài (ms)
  soundcloud_client_id: "" # để trống = bot tự lấy client_id từ asset chính chủ SoundCloud

# ===== TẢI MEDIA (autodown — pure JS, không cần Python/yt-dlp) =====
media:
  # Cookie TikTok để qua anti-bot khi lấy thông tin profile/video.
  # Lấy: đăng nhập tiktok.com trên trình duyệt → F12 Console → document.cookie → copy chuỗi.
  # Hoặc set env TIKTOK_COOKIES.
  tiktok_cookies: "" # set via env JT_MEDIA__TIKTOK_COOKIES or paste locally (do not commit)
  # Cookie Facebook (nếu cần lấy nội dung yêu cầu đăng nhập) — tương tự, env FACEBOOK_COOKIES.
  facebook_cookies: "" # set via env JT_MEDIA__FACEBOOK_COOKIES or paste locally (do not commit)
  youtube_cookies: "" # set via env JT_MEDIA__YOUTUBE_COOKIES or paste locally (do not commit)

# ===== AUTODOWN (tự động tải media trong nhóm) =====
autodown:
  enabled: true # cho phép tính năng autodown chạy (mặc định tắt mỗi nhóm, bật bằng lệnh autodown on)
  rate_limit_max: 5 # tối đa số lần tải mỗi nhóm trong 1 cửa sổ thời gian
  rate_limit_window_ms: 300000 # cửa sổ thời gian rate limit (ms) = 5 phút
  circuit_fail_threshold: 3 # số lần thất bại liên tiếp thì đóng circuit breaker nền tảng đó
  circuit_cooldown_ms: 600000 # thời gian chờ trước khi mở lại circuit breaker (ms) = 10 phút
  url_dedup_ttl_ms: 120000 # tránh xử lý trùng cùng 1 link trong khoảng này (ms) = 2 phút
  cache_ttl_ms: 600000 # cache media đã tải (ms) = 10 phút
  max_concurrent_downloads: 3 # số tải song đồng thời tối đa
  max_video_mb: 200 # giới hạn dung lượng video mỗi file (MB)
