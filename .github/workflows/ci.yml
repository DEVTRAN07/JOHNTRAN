name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node scripts/test-commands.js
      - run: node scripts/test-all.js

  deploy:
    name: Deploy to Render
    needs: test
    # Chỉ deploy khi push lên main (không deploy trên PR)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: john-tran-bot
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::GitHub Actions secret RENDER_API_KEY is not configured."
            exit 1
          fi

          services="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=100")"
          service_id="$(jq -er --arg name "$SERVICE_NAME" '
            [.[] | (.service // .) | select(.name == $name) | .id] | unique
            | if length == 1 then .[0] else error("Expected exactly one Render service named " + $name) end
          ' <<< "$services")"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}" \
            "https://api.render.com/v1/services/${service_id}/deploys"
