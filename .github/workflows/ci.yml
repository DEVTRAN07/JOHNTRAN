name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Syntax check all JS files
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.kilo/*"); do
            node -c "$f" || { echo "LỖI SYNTAX: $f"; exit 1; }
          done
          echo "Tất cả file JS cú pháp hợp lệ"
