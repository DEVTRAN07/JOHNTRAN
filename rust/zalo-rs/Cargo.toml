[package]
name = "zalo-rs"
version = "1.0.0"
edition = "2021"

[dependencies]
zalo-rs = { git = "https://github.com/DEVTRAN07/Zalo-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "1"
anyhow = "1"
